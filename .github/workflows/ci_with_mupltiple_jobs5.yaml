name: Text-to-SQL Chatbot CI Pipeline

# Events that trigger the workflow
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

# Minimum permissions
permissions:
  contents: read

jobs:
  # Job 1: Check Python syntax (fast, no heavy dependencies needed)
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python Files
        run: |
          python -m compileall -q app main.py

  # Job 2: Validate the SQLite database file (uses Python's built-in sqlite3)
  database-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SQLite Database
        run: |
          python -c "import sqlite3; c=sqlite3.connect('uber.db'); print('Database:', c.execute('PRAGMA integrity_check').fetchone()[0]); c.close()"

  # Job 3: Install full dependencies and verify environment
  build-and-test:
    runs-on: ubuntu-latest
    needs: [syntax-check, database-validation] # Runs only after Jobs 1 & 2 pass
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
